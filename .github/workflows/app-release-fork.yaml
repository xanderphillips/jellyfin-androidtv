name: App / Publish (fork release)

# Trimmed copy of app-publish.yaml for Paul's personal fork: no upstream-org gate, no
# jellyfin.org rsync/deploy steps. Builds a release-signed APK and attaches it to the
# GitHub Release that triggered the run, so the in-app updater
# (org.jellyfin.androidtv.update package) has something to fetch from
# GET /repos/xanderphillips/jellyfin-androidtv/releases/latest.

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Build and attach release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Set JELLYFIN_VERSION
        run: echo "JELLYFIN_VERSION=$(echo '${{ github.event.release.tag_name }}' | sed 's#^v##' | tr / -)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/release/*-release.apk --clobber
