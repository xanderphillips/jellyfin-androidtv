name: App / Publish (fork release)

# Trimmed copy of app-publish.yaml for Paul's personal fork: no upstream-org gate, no
# jellyfin.org rsync/deploy steps. Builds a release-signed APK and attaches it to the
# GitHub Release that triggered the run, so the in-app updater
# (org.jellyfin.androidtv.update package) has something to fetch from
# GET /repos/xanderphillips/jellyfin-androidtv/releases/latest.

on:
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    name: Build and attach release APK
    # Never sign prereleases or drafts with the release key.
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      # Runs before any secret is referenced. The tag is untrusted input: it is passed
      # via env and quoted, never interpolated into the script body.
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "::error::Release tag does not match the fork release pattern; refusing to sign."
            exit 1
          fi
          echo "JELLYFIN_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore.jks

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/*-release.apk --clobber
